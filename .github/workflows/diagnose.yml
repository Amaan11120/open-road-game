name: Diagnose Android Setup

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Print SDK and Java layout
        shell: bash
        run: |
          echo "HOME=$HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDK=${ANDROID_HOME:-/usr/lib/android-sdk}
          echo "--- SDK top level"; ls $SDK
          echo "--- cmdline-tools"; ls $SDK/cmdline-tools 2>&1
          echo "--- platform-tools"; ls $SDK/platform-tools 2>&1 | head
          echo "--- build-tools"; ls $SDK/build-tools 2>&1
          echo "--- platforms"; ls $SDK/platforms 2>&1
          echo "--- javac"; which javac; readlink -f $(which javac)
          echo "--- templates"; ls ~/.local/share/godot/export_templates/ 2>&1
          echo "--- root templates"; ls /root/.local/share/godot/export_templates/*/ 2>&1 | head -20
