name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Show environment (for debugging)
        run: |
          godot --version || true
          ls /root/.local/share/godot/export_templates/ || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          which javac || true

      - name: Set up Godot export tools
        shell: bash
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /tmp/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          JDK=$(dirname $(dirname $(readlink -f $(which javac))))
          SDK=${ANDROID_HOME:-/usr/lib/android-sdk}
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.3.tres; do
          cat > ~/.config/godot/$f <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JDK"
          export/android/android_sdk_path = "$SDK"
          export/android/debug_keystore = "/tmp/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          done

      - name: Import project
        run: godot --headless --import || true

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/open-road.apk

      - uses: actions/upload-artifact@v4
        with:
          name: open-road-apk
          path: build/open-road.apk
